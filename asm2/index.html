<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">

</head>
<body>

<p>Tên</p><input type="text" id="ten">
<p>DOB</p><input type="text" id="ngaysinh">
<p>Maths Scores</p><input type="text" id="diemtoan">
<p>Physical Scores</p><input type="text" id="diemly">
<p>Chemical Scores</p><input type="text" id="diemhoa">
<button id="Nhap">Nhập</button>
<button id="tinhdiemtrungbinh">Tính điểm trung bình</button>
<button id="xacdinhhocluc">Xác định học lực</button>
<table width="100%">
    <thead>
        <tr>
            <th>Họ và tên</th>
            <th>Ngày tháng năm sinh</th>
            <th>Điểm toán</th>
            <th>Điểm lý</th>
            <th>Điểm hóa</th>
            <th>Điểm trung bình</th>
            <th>Học lực</th>
        </tr>
    </thead>
    <tbody id="tbody">

    </tbody>
</table>
<script>
    var index = 1;

    function addRow (){
        var tbody = document.getElementById("tbody");
        console.log(tbody)
        var tr1 = document.createElement("tr");
        tbody.append(tr1);
        tr1.id = index;
        
        var tdHT = document.createElement("td");
        var tdNgaySinh = document.createElement("td");
        var tdDiemToan = document.createElement("td");
        var tdDiemLy = document.createElement("td");
        var tdDiemHoa = document.createElement("td");
        var tdDiemTrungBinh = document.createElement("td");
        var tdHocLuc = document.createElement("td");

        
        tdDiemToan.id = "dToan" + index;
        tdDiemLy.id = "dLy" + index;
        tdDiemHoa.id = "dHoa" + index;
        tdDiemTrungBinh.id = "dTrungBinh" + index;
        tdHocLuc.id = "hLuc" + index;

        index = index + 1;

        tr1.append(tdHT);
        tr1.append(tdNgaySinh);
        tr1.append(tdDiemToan);
        tr1.append(tdDiemLy);
        tr1.append(tdDiemHoa);
        tr1.append(tdDiemTrungBinh);
        tr1.append(tdHocLuc);

        tdHT.innerHTML = nhapTen.value;
        tdNgaySinh.innerHTML = nhapNgaySinh.value;
        tdDiemToan.innerHTML = nhapDiemToan.value;
        tdDiemLy.innerHTML = nhapDiemLy.value;
        tdDiemHoa.innerHTML = nhapDiemHoa.value;
        tdDiemTrungBinh.innerHTML = "?";
        tdHocLuc.innerHTML = "?";
    };

    var nhap = document.getElementById("Nhap");
    nhap.onclick=addRow;
    let nhapTen = document.getElementById("ten");
    let nhapNgaySinh = document.getElementById("ngaysinh");
    let nhapDiemToan = document.getElementById("diemtoan");
    let nhapDiemLy = document.getElementById("diemly");
    let nhapDiemHoa = document.getElementById("diemhoa");

    function diemTB(){
        for (var i = 1; i<index; i++){
            var llToan = document.getElementById("dToan" + i);
            var llLy = document.getElementById("dLy" + i);
            var llHoa = document.getElementById("dHoa" + i);
            var LLdTrungBinh = document.getElementById("dTrungBinh" + i);
        
            console.log(llToan.innerHTML);
            console.log(llLy.innerHTML);
            console.log(llHoa.innerHTML);
            console.log(LLdTrungBinh);
            LLdTrungBinh.innerHTML = (llLy.innerHTML -(- llHoa.innerHTML) -(- llToan.innerHTML))/3;
        }
    }

    var diemTrungBinh = document.getElementById("tinhdiemtrungbinh");
    diemTrungBinh.onclick = diemTB;

    function hocLuc(){
        for (var i = 1; i < index; i++){
            var LLdTrungBinh = document.getElementById("dTrungBinh" + i);
            var LLHocLuc = document.getElementById("hLuc" + i);
            if (LLdTrungBinh.innerHTML > 8){
                LLHocLuc.innerHTML = "<span style='background-color:yellow'> Hoc sinh gioi </span>";
            } else if (LLdTrungBinh.innerHTML <= 8 && LLdTrungBinh.innerHTML > 6) {
                LLHocLuc.innerHTML = "<span style='background-color:yellow'> Hoc sinh kha </span>";
            } else{
                LLHocLuc.innerHTML = "<span style='background-color:yellow'> Hoc sinh trung binh </span>";
            }
        }

    }
    var xdHocLuc = document.getElementById("xacdinhhocluc");
    xdHocLuc.onclick = hocLuc;
</script>
</body>
</html>
