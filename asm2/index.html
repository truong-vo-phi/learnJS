<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">

</head>
<body>

<p>Tên</p><input type="text" id="ten">
<p>DOB</p><input type="text" id="ngaysinh">
<p>Maths Scores</p><input type="text" id="diemtoan">
<p>Physical Scores</p><input type="text" id="diemly">
<p>Chemical Scores</p><input type="text" id="diemhoa">
<button id="Nhap">Nhập</button>
<button id="tinhdiemtrungbinh">Tính điểm trung bình</button>
<button id="xacdinhhocluc">Xác định học lực</button>
<table width="100%">
    <thead>
        <tr>
            <th>Họ và tên</th>
            <th>Ngày tháng năm sinh</th>
            <th>Điểm toán</th>
            <th>Điểm lý</th>
            <th>Điểm hóa</th>
            <th>Điểm trung bình</th>
            <th>Học lực</th>
        </tr>
    </thead>
    <tbody id="tbody">

    </tbody>
</table>
<script>
    var index = 1;

    function addRow (){
        var tbody = document.getElementById("tbody");
        console.log(tbody)
        var trNew = document.createElement("tr");
        tbody.append(trNew);
        trNew.id = index;
        
        var tdHT = document.createElement("td");
        var tdNgaySinh = document.createElement("td");
        var tdDiemToan = document.createElement("td");
        var tdDiemLy = document.createElement("td");
        var tdDiemHoa = document.createElement("td");
        var tdDiemTrungBinh = document.createElement("td");
        var tdHocLuc = document.createElement("td");

        
        tdDiemToan.id = "dToan" + index;
        tdDiemLy.id = "dLy" + index;
        tdDiemHoa.id = "dHoa" + index;
        tdDiemTrungBinh.id = "dTrungBinh" + index;
        tdHocLuc.id = "hLuc" + index;

        index = index + 1;

        trNew.append(tdHT);
        trNew.append(tdNgaySinh);
        trNew.append(tdDiemToan);
        trNew.append(tdDiemLy);
        trNew.append(tdDiemHoa);
        trNew.append(tdDiemTrungBinh);
        trNew.append(tdHocLuc);

        tdHT.innerHTML = nhapTen.value;
        tdNgaySinh.innerHTML = nhapNgaySinh.value;
        tdDiemToan.innerHTML = nhapDiemToan.value;
        tdDiemLy.innerHTML = nhapDiemLy.value;
        tdDiemHoa.innerHTML = nhapDiemHoa.value;
        tdDiemTrungBinh.innerHTML = "?";
        tdHocLuc.innerHTML = "?";
    };

    var nhap = document.getElementById("Nhap");
    nhap.onclick=addRow;
    let nhapTen = document.getElementById("ten");
    let nhapNgaySinh = document.getElementById("ngaysinh");
    let nhapDiemToan = document.getElementById("diemtoan");
    let nhapDiemLy = document.getElementById("diemly");
    let nhapDiemHoa = document.getElementById("diemhoa");

    function diemTB(){
        for (var currentIndex = 1; currentIndex < index; currentIndex++){
            var layDiemToan = document.getElementById("dToan" + currentIndex);
            var layDiemLy = document.getElementById("dLy" + currentIndex);
            var layDiemHoa = document.getElementById("dHoa" + currentIndex);
            var laydTrungBinh = document.getElementById("dTrungBinh" + currentIndex);
        
            console.log(layDiemToan.innerHTML);
            console.log(layDiemLy.innerHTML);
            console.log(layDiemHoa.innerHTML);
            console.log(laydTrungBinh);
            laydTrungBinh.innerHTML = (layDiemLy.innerHTML -(- layDiemHoa.innerHTML) -(- layDiemToan.innerHTML))/3;
        }
    }

    var xdDiemTrungBinh = document.getElementById("tinhdiemtrungbinh");
    xdDiemTrungBinh.onclick = diemTB;

    function hocLuc(){
        for (var currentIndex = 1; currentIndex < index; currentIndex++){
            var laydTrungBinh = document.getElementById("dTrungBinh" + currentIndex);
            var layHocLuc = document.getElementById("hLuc" + currentIndex);
            if (laydTrungBinh.innerHTML > 8){
                layHocLuc.innerHTML = "<span style='background-color:yellow'> Hoc sinh gioi </span>";
            } else if (laydTrungBinh.innerHTML <= 8 && laydTrungBinh.innerHTML > 6) {
                layHocLuc.innerHTML = "<span style='background-color:yellow'> Hoc sinh kha </span>";
            } else{
                layHocLuc.innerHTML = "<span style='background-color:yellow'> Hoc sinh trung binh </span>";
            }
        }

    }
    var xdHocLuc = document.getElementById("xacdinhhocluc");
    xdHocLuc.onclick = hocLuc;
</script>
</body>
</html>
