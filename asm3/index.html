<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập, tính điểm  trung bình và xếp loại học sinh giỏi</title>
    <link rel="stylesheet" href="./index.css">  
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<form>
    <div class="col-12 col-md-4 mt-5 ">
        <div class="form-group">
            <label for="hoten">Họ và tên</label>
            <input type="text" class="form-control" id="hoten">
        </div>
        <div class="form-group">
            <label for="dob">DOB</label>
            <input type="text" class="form-control" id="dob">
        </div>
        <div class="form-group">
            <label for="diemtoan">Điểm Toán</label>
            <input type="text" class="form-control" id="diemtoan">
        </div>
        <div class="form-group">
            <label for="diemly">Điểm Lý</label>
            <input type="text" class="form-control" id="diemly">
        </div>
        <div class="form-group">
            <label for="diemhoa">Điểm Hóa</label>
            <input type="text" class="form-control" id="diemhoa">
        </div>
        <button id="nhap"  class="btn btn-primary">Nhập</button>
        <button id="tinhdiemtrungbinh" class="btn btn-primary">Tính điểm trung bình</button>
        <button id="xacdinhhocluc" class="btn btn-primary">Xác định học lực</button>
    </div>
    <div class="col-12 col-md-8">
        <div id="root"></div>
    </div>

</form>
<script>
$(document).ready(function() {
    let table = $("<table>");
    table.addClass("table mt-5");

    // Create table headers
    let tr = $("<tr>");
    table.append(tr);

    let headers = [
        show_image("https://cdn.pixabay.com/photo/2016/11/14/17/39/person-1824147_640.png"), show_image("https://cdn.pixabay.com/photo/2016/11/14/17/39/person-1824147_640.png"), "Năm sinh", "Điểm Toán",  "Điểm Lý", "Điểm Hóa", "Điểm Trung Bình", "Xếp Loại"
    ];

    headers.forEach(header => {
        let th = $("<th>").text(header);
        tr.append(th);
    })

    $("#root").append(table);

    let stt = 0; //Counter for student rows
    $("button").click(function(e) {
        e.preventDefault();
    });
    // Add student data to the table
    $("#nhap").click(function(){
        const hoTen = $("#hoten").val().trim();
        const dob = $("#dob").val().trim();
        const diemToan = $("#diemtoan").val().trim();
        const diemLy = $("#diemly").val().trim();
        const diemHoa = $("#diemhoa").val().trim();

        if (!hoTen || !dob || !diemToan || !diemLy || !diemHoa) {
            alert("Vui lòng nhập đủ thông tin!");
            return;
        }

        stt++;
        let trNew = $("<tr>").attr("id",`data${stt}`);
        table.append(trNew);

        [stt, hoTen, dob, diemToan, diemLy, diemHoa, "?", "?"].forEach(content =>{
            let td = $("<td>").text(content);
            trNew.append(td);
        })
        trNew.find("td:eq(6)").attr("id", `diemTrungBinh${stt}`); // Set ID for average cell
        trNew.find("td:eq(7)").addClass("hLuc"); // Add class for classification cell
    });
    // Calculate average scores
    $("#tinhdiemtrungbinh").click(function() {
        for (let i = 1; i <= stt; i++) {
            let row = $(`#data${i}`);
            let diemToan = parseFloat(row.find("td:eq(3)").text());
            let diemLy = parseFloat(row.find("td:eq(4)").text());
            let diemHoa = parseFloat(row.find("td:eq(5)").text());

            if (!isNaN(diemToan) && !isNaN(diemLy) && !isNaN(diemHoa)) {
                let average = ((diemToan + diemLy + diemHoa) / 3).toFixed(2);
                row.find("#diemTrungBinh" + i).text(average);
            } else {
                alert(`Lỗi ở hàng ${i}: Kiểm tra đầu vào điểm.`);
            }
        }
    });

    // Determine academic performance
    $("#xacdinhhocluc").click(function() {
        for (let i = 1; i <= stt; i++) {
            let row = $(`#data${i}`);
            let average = parseFloat(row.find("#diemTrungBinh" + i).text());
            let hocLucCell = row.find(".hLuc");

            if (!isNaN(average)) {
                if (average > 8) {
                    hocLucCell.html('<span style="background-color:yellow">Học sinh giỏi</span>');
                } else if (average > 6) {
                    hocLucCell.html('<span style="background-color:lightblue">Học sinh khá</span>');
                } else {
                    hocLucCell.html('<span style="background-color:pink">Học sinh trung bình</span>');
                }
            }
        }
    });
});
function show_image(src) {
    let img = document.createElement("img");
    img.src = src;
    img.width = 100;
    img.height = 140;

    document.body.appendChild(img);
}

</script>
</body>
</html>
