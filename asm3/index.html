<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập, tính điểm trung bình và xếp loại học sinh giỏi</title>
    <link rel="stylesheet" href="./index.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<form>
    <div class="col-12 col-md-4 mt-5">
        <table class="table-input">
            <tbody>
                <tr>
                    <div class="form-group">
                        <td><label for="hoten">Họ tên</label></td>
                        <td><input type="text" class="form-control" id="hoten">
                    </div>
                </tr>
                <tr>
                    <div class="form-group">
                        <td><label for="dob">DOB</label></td>
                        <td><input type="text" class="form-control" id="dob"></td>
                    </div>
                </tr>
                <tr>
                    <div class="form-group">
                        <td><label for="diemtoan">Điểm Toán</label>
                        <td><input type="text" class="form-control" id="diemtoan">
                    </div>
                </tr>
                <tr>
                    <div class="form-group">
                        <td><label for="diemly">Điểm Lý</label>
                        <td><input type="text" class="form-control" id="diemly">
                    </div>
                </tr>
                <tr>
                    <div class="form-group">
                        <td><label for="diemhoa">Điểm Hóa</label>
                        <td><input type="text" class="form-control" id="diemhoa">
                    </div>
                </tr>
            </tbody>
        </table>
        <table class="table-button">
            <tr>
                <td><button type="button" id="nhap" class="btn btn-primary">Nhập</button></td>
                <td><button type="button" id="tinhdiemtrungbinh" class="btn btn-primary">Tính điểm trung bình</button></td>
                <td><button type="button" id="xacdinhhocluc" class="btn btn-primary">Xác định học lực</button></td>
            </tr>
        </table>
    </div>

    <div class="col-12 col-md-8">
        <div id="root"></div>
    </div>
</form>

<script>
    $(document).ready(function() {

        var table = $("<table>").addClass("table");
        var tr = $("<tr>");
        table.append(tr);

        var headers = [
            "STT",
            "Họ và tên",
            "Năm sinh",
            "Điểm Toán",
            "Điểm Lý",
            "Điểm Hóa",
            "Điểm Trung Bình",
            "Xếp Loại"
        ];

        headers.forEach(header => {
            let th = $("<th>").text(header);
            tr.append(th);
        });

        let stt = 0; // Counter for student rows

        // Add student data to the table
        $("#nhap").click(function() {
            const HOTEN = $("#hoten").val().trim();
            const DOB = $("#dob").val().trim();
            const DIEMTOAN = $("#diemtoan").val().trim();
            const DIEMLY = $("#diemly").val().trim();
            const DIEMHOA = $("#diemhoa").val().trim();

            if (!HOTEN || !DOB || !DIEMTOAN || !DIEMLY || !DIEMHOA) {
                alert("Vui lòng nhập đủ thông tin!");
                return;
            }

            stt++;
            let trNew = $("<tr>").attr("id", `data${stt}`);
            table.append(trNew);

            var properties = [stt, HOTEN, DOB, DIEMTOAN, DIEMLY, DIEMHOA, "?", "?"];
            properties.forEach(property => {
                let td = $("<td>").text(property);
                trNew.append(td);
            });

            trNew.find("td:eq(6)").attr("id", `diemTrungBinh${stt}`); // Set ID for average cell
            trNew.find("td:eq(7)").addClass("hLuc"); // Add class for classification cell
        });

        $("#root").append(table).addClass("score");

        $("button").click(function(e) {
            e.preventDefault();
        });

        // Calculate the average score
        $("#tinhdiemtrungbinh").click(function() {
            for (let i = 1; i <= stt; i++) {
                let row = $(`#data${i}`);
                const DIEMTOAN = parseFloat(row.find("td:eq(3)").text());
                const DIEMLY = parseFloat(row.find("td:eq(4)").text());
                const DIEMHOA = parseFloat(row.find("td:eq(5)").text());

                if (!isNaN(DIEMTOAN) && !isNaN(DIEMLY) && !isNaN(DIEMHOA)) {
                    let average = ((DIEMTOAN + DIEMLY + DIEMHOA) / 3).toFixed(2);
                    row.find("#diemTrungBinh" + i).text(average);
                } else {
                    alert(`Lỗi ở hàng ${i}: Kiểm tra đầu vào điểm.`);
                }
            }
        });

        // Determine student classification
        $("#xacdinhhocluc").click(function() {
            for (let i = 1; i <= stt; i++) {
                let row = $(`#data${i}`);
                let average = parseFloat(row.find("#diemTrungBinh" + i).text());
                let hocLucCell = row.find(".hLuc");

                if (!isNaN(average)) {
                    if (average > 8) {
                        hocLucCell.html('<span style="background-color:yellow">Học sinh giỏi</span>');
                    } else if (average > 6) {
                        hocLucCell.html('<span style="background-color:lightblue">Học sinh khá</span>');
                    } else {
                        hocLucCell.html('<span style="background-color:pink">Học sinh trung bình</span>');
                    }
                }
            }
        });
    });
</script>

</body>
</html>
